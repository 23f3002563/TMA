{% extends "staff/base.html" %}

{% block title %}
Staff Dashboard
{% endblock %}

{% block content %}

<h2 class="text-center mb-5">

    Staff Dashboard

</h2>



<div class="row justify-content-center g-4">

    <!-- Assigned Treks -->

    <div class="col-md-4">

        <div class="card dashboard-card shadow text-center p-4">

            <i class="bi bi-tree text-success display-5"></i>

            <h3 class="mt-3">

                Assigned Treks

            </h3>

            <h2>

                {{ total_treks }}

            </h2>

            <a href="{{ url_for('staff.treks') }}"
               class="btn btn-success mt-3">

                View Treks

            </a>

        </div>

    </div>




    <!-- Trekkers -->

    <div class="col-md-4">

        <div class="card dashboard-card shadow text-center p-4">

            <i class="bi bi-people text-success display-5"></i>

            <h3 class="mt-3">

                Registered Trekkers

            </h3>

            <h2>

                {{ total_trekkers }}

            </h2>

        </div>

    </div>

</div>

{% endblock %}
