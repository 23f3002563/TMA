{% extends "staff/base.html" %}

{% block title %}
Update Trek
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-header bg-success text-white text-center py-3">

                    <h3 class="mb-0">

                        <i class="bi bi-pencil-square"></i>
                        Update Trek

                    </h3>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <!-- Available Slots -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                <i class="bi bi-people-fill text-success"></i>
                                Available Slots

                            </label>

                            <input
                                type="number"
                                name="available_slots"
                                value="{{ trek.available_slots }}"
                                class="form-control">

                        </div>



                        <!-- Trek Status -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                <i class="bi bi-flag-fill text-success"></i>
                                Trek Status

                            </label>

                            <select
                                name="status"
                                class="form-select">

                                <option value="Open"
                                {% if trek.status == "Open" %}selected{% endif %}>
                                    Open
                                </option>

                                <option value="Closed"
                                {% if trek.status == "Closed" %}selected{% endif %}>
                                    Closed
                                </option>

                                <option value="Started"
                                {% if trek.status == "Started" %}selected{% endif %}>
                                    Started
                                </option>

                                <option value="Completed"
                                {% if trek.status == "Completed" %}selected{% endif %}>
                                    Completed
                                </option>

                            </select>

                        </div>



                        <!-- Buttons -->

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('staff.treks') }}"
                               class="btn btn-outline-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Back

                            </a>



                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle"></i>
                                Update Trek

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
