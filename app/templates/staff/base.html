<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Staff Panel
        {% endblock %}
    </title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Staff CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/staff.css') }}">

    {% block extra_css %}{% endblock %}

</head>

<body>


<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-success fs-3"
           href="{{ url_for('staff.dashboard') }}">

            <i class="bi bi-tree-fill"></i>
            TrekHub

        </a>

        <div class="ms-auto d-flex align-items-center">

            <span class="me-4 fw-semibold">

                Welcome,  !

            </span>


            <a href="{{ url_for('staff.dashboard') }}"
               class="nav-link">

                Home

            </a>


            <a href="{{ url_for('staff.profile') }}"
               class="nav-link">

                Profile

            </a>


            <a href="{{ url_for('auth.logout') }}"
               class="nav-link text-danger">

                Logout

            </a>

        </div>

    </div>

</nav>



<div class="container mt-4">

{% block content %}
{% endblock %}

</div>



<footer class="footer text-center mt-5">

    <p>

        © 2026 TrekHub | Trekking Management System

    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
