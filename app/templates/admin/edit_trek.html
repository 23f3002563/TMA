{% extends "admin/admin_base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Page Heading -->

    <div class="mb-4">

        <h2 class="fw-bold">

            <i class="bi bi-pencil-square text-success"></i>

            Edit Trek

        </h2>

        <p class="text-muted">
            Update trek information below.
        </p>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form method="POST">

                <div class="row">

                    <!-- Trek Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input
                            type="text"
                            name="trek_name"
                            class="form-control"
                            value="{{ trek.trek_name }}"
                            required>

                    </div>

                    <!-- Location -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            value="{{ trek.location }}"
                            required>

                    </div>

                    <!-- Difficulty -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select
                            name="difficulty"
                            class="form-select">

                            <option value="Easy"
                            {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                Easy
                            </option>

                            <option value="Moderate"
                            {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                Moderate
                            </option>

                            <option value="Difficult"
                            {% if trek.difficulty=="Difficult" %}selected{% endif %}>
                                Difficult
                            </option>

                        </select>

                    </div>

                    <!-- Duration -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Duration (Days)
                        </label>

                        <input
                            type="number"
                            name="duration"
                            class="form-control"
                            value="{{ trek.duration }}"
                            required>

                    </div>

                    <!-- Slots -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            value="{{ trek.available_slots }}"
                            required>

                    </div>

                    <!-- Staff -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Assign Staff
                        </label>

                        <select
                            name="staff_id"
                            class="form-select">

                            <option value="">
                                Select Staff
                            </option>

                            {% for staff in staff_members %}

                            <option value="{{ staff.id }}"
                            {% if trek.staff_id == staff.id %}selected{% endif %}>

                                {{ staff.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Update Trek

                    </button>

                    <a href="{{ url_for('admin.treks') }}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
