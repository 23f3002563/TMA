 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
 </head>
 <body>
    {% extends "admin/admin_base.html" %}

    {% block title %}Dashboard{% endblock %}

    {% block content %}

    <h2>Admin Dashboard</h2>

    <div class="dashboard-cards">

        <div class="card">
            <h3>Total Treks</h3>
            <p>{{ total_treks }}</p>
        </div>

        <div class="card">
            <h3>Total Users</h3>
            <p>{{ total_users }}</p>
        </div>

        <div class="card">
            <h3>Total Staff</h3>
            <p>{{ total_staff }}</p>
        </div>

        <div class="card">
            <h3>Total Bookings</h3>
            <p>{{ total_bookings }}</p>
        </div>

    </div>
    {% endblock %}
 </body>
 </html>
