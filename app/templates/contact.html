{% extends "base.html" %}

{% block title %}
Contact | TrekHub
{% endblock %}

{% block content %}

<section class="section">

    <div class="container">

        <h2 class="section-title">
            Contact Us
        </h2>

        <div class="row g-4">

            <div class="col-md-4">

                <div class="custom-card text-center">

                    <i class="bi bi-envelope-fill display-4 text-success"></i>

                    <h4 class="mt-3">
                        Email
                    </h4>

                    <p>
                        support@trekhub.com
                    </p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="custom-card text-center">

                    <i class="bi bi-telephone-fill display-4 text-success"></i>

                    <h4 class="mt-3">
                        Phone
                    </h4>

                    <p>
                        +91 8421094088
                    </p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="custom-card text-center">

                    <i class="bi bi-geo-alt-fill display-4 text-success"></i>

                    <h4 class="mt-3">
                        Location
                    </h4>

                    <p>
                        Akola, Maharashtra, India
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
