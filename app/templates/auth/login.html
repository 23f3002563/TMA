{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="hero">

    <div class="form-card">

        <div class="text-center mb-4">

            <i class="bi bi-box-arrow-in-right text-success" style="font-size:60px;"></i>

            <h2 class="mt-3">Welcome Back</h2>

            <p class="text-muted">
                Login to continue your trekking journey.
            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>

            <div class="d-grid">

                <button type="submit" class="btn btn-success btn-lg">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </div>

        </form>

        <hr>

        <p class="text-center">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}"
               class="text-success text-decoration-none fw-semibold">

                Register Here

            </a>

        </p>

    </div>

</section>

{% endblock %}
