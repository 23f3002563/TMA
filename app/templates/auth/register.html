{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="hero">

    <div class="form-card">

        <div class="text-center mb-4">

            <i class="bi bi-person-plus-fill text-success" style="font-size:60px;"></i>

            <h2 class="mt-3">Create Account</h2>

            <p class="text-muted">
                Join TrekHub and start your next adventure.
            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Select Role
                </label>

                <select
                    name="role"
                    class="form-select">

                    <option value="user">
                        User
                    </option>

                    <option value="staff">
                        Staff
                    </option>

                </select>

            </div>

            <div class="d-grid">

                <button
                    type="submit"
                    class="btn btn-success btn-lg">

                    <i class="bi bi-person-check-fill"></i>

                    Register

                </button>

            </div>

        </form>

        <hr>

        <p class="text-center">

            Already have an account?

            <a href="{{ url_for('auth.login') }}"
               class="text-success fw-semibold text-decoration-none">

                Login Here

            </a>

        </p>

    </div>

</section>

{% endblock %}
